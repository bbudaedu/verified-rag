[project]
name = "verified-rag"
version = "0.1.0"
description = "Verify that an LLM-written wiki says only what its sources say"
readme = "README.md"
authors = [
    { name = "bbudaedu" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
verified-rag = "verified_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
